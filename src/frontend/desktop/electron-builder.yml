appId: com.animama.desktop
productName: Animama
copyright: Copyright (c) 2026 Raymond Van. All rights reserved.
directories:
  output: release
beforeBuild: ./scripts/before-build.mjs
electronDownload:
  cache: .electron-cache
files:
  - dist/**/*
  - package.json
  - from: ../../..
    to: .
    filter:
      - LICENSE
asarUnpack:
  - dist/native/*.node
extraMetadata:
  main: dist/main.js
# App icons come from the brand mark; regenerate them with `pnpm desktop:icons`.
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  minimumSystemVersion: "15.0"
  defaultArch: arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Animama uses the microphone for dictation and voice mode.
  extraResources:
    # Translated microphone prompts go into the lproj folders Electron already
    # ships (ja, ko, zh_CN, zh_TW), so the bundle gains no new localization.
    # English stays in extendInfo above.
    - from: build/locales
      to: .
      filter:
        - "*.lproj/InfoPlist.strings"
    # Each target packages exactly its own audited stage.
    - from: .desktop-runtime/darwin-arm64/runtime
      to: runtime
      filter:
        - "**/*"
win:
  icon: build/icon.ico
  defaultArch: x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: .desktop-runtime/win32-x64/runtime
      to: runtime
      filter:
        - "**/*"
# A one-click, per-user installer: %LOCALAPPDATA%\Programs\Animama, no UAC.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  createStartMenuShortcut: true
  shortcutName: Animama
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
