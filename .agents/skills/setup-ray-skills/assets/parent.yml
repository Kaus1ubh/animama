name: Outcome specification
description: Agree an outcome and acceptance before phased delivery.
body:
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: Link the authoritative spec, or write "This issue" when this body owns it. Identify any linked file as a dated snapshot after publication.
  - type: textarea
    id: execplan
    attributes:
      label: ExecPlan
      description: Link the execution plan when access and privacy allow; otherwise state "Retained privately" or "Not required". Keep this issue independently usable.
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended users
      description: Describe the problem and who benefits.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Goals, scope and non-goals
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Required behavior and constraints
      description: Include relevant failures, recovery, persistence and compatibility.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Agreement and open decisions
      description: State proposal or agreement, its reference, and unresolved questions.
  - type: textarea
    id: delivery
    attributes:
      label: Delivery links
      description: Plan phases, any phase issues, dependencies and PRs; no private prerequisite for public readers.
