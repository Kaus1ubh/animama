name: Portable product validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Run full validation without restoring or saving dependency download caches
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-validation:
        description: Reusable callers always require full validation; false is rejected
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A release caller uses its run identity so another dispatch cannot cancel
  # validation underneath a credential-bearing release. PR pushes supersede PRs.
  group: portable-product-${{ github.workflow }}-${{ github.workflow == 'Portable product validation' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # GitHub invokes bash with -e and -o pipefail, including tee pipelines.

jobs:
  validation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      backend: ${{ steps.select.outputs.backend }}
      portable: ${{ steps.select.outputs.portable }}
      retention: ${{ steps.select.outputs.retention }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false
          persist-credentials: false
      - name: Test conservative selection and failure aggregation
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Select checks from the complete PR diff
        id: select
        env:
          CI_READ_TOKEN: ${{ github.token }}
          CI_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/ci/validation.py plan --output "$RUNNER_TEMP/selection.json"
      - name: Retain compact selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selection-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selection.json
          retention-days: 14

  backend-static-tests:
    needs: validation-plan
    if: needs.validation-plan.outputs.backend != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_NO_SYNC: "1"
      ANIMAMA_RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          lfs: ${{ needs.validation-plan.outputs.backend != 'docs' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        id: uv
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: ${{ !inputs.cold-cache }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            scripts/package-sets/build-constraints.txt
          cache-suffix: p95-uv0.11.28-python3.12.13-${{ runner.os }}-${{ runner.arch }}
      - run: uv sync --frozen --python 3.12.13 --extra server
      - name: Install backend verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run the selected offline backend verification contract
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/backend-pytest.xml
          BACKEND_PROFILE: ${{ needs.validation-plan.outputs.backend }}
        # Docker-backed fixtures must fail when Docker or required content is
        # missing. This never substitutes a reduced suite or paid provider run.
        run: |
          {
            command -v rg
            case "$BACKEND_PROFILE" in
              full) make check-test ;;
              guards)
                make audit-typed-content
                uv run --no-sync pytest -q tests/test_accountless_repository_boundaries.py
                ;;
              docs)
                make audit-typed-content
                uv run --no-sync pytest -q tests/test_generate_synthetic_docs.py tests/test_accountless_repository_boundaries.py
                ;;
              *) echo "Unknown backend validation profile" >&2; exit 1 ;;
            esac
          } 2>&1 | tee "$RUNNER_TEMP/backend-checks.log"
      - name: Retain backend success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-checks.log
            ${{ runner.temp }}/backend-pytest.xml
          retention-days: ${{ job.status != 'success' && 14 || needs.validation-plan.outputs.retention }}
      - name: Record backend results and download cache state
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB: backend-static-tests
        run: python3 scripts/ci/job_receipt.py --output "$RUNNER_TEMP/backend-receipt.json"
      - name: Retain compact backend receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-receipt.json
          retention-days: 14

  portable-product:
    needs: validation-plan
    if: needs.validation-plan.outputs.portable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        id: uv
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: ${{ !inputs.cold-cache }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            scripts/package-sets/build-constraints.txt
          cache-suffix: p95-uv0.11.28-python3.12.13-${{ runner.os }}-${{ runner.arch }}
      - run: npm install --global pnpm@10.33.0
      - name: Locate the pnpm download store
        id: pnpm-store
        working-directory: src/frontend
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Reuse pnpm downloads with a clean frozen install
        if: ${{ !inputs.cold-cache }}
        id: pnpm-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24.15.0-pnpm10.33.0-${{ hashFiles('src/frontend/pnpm-lock.yaml', 'src/frontend/pnpm-workspace.yaml') }}
      - run: uv sync --frozen --python 3.12.13 --extra server
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - name: Check shared import and boundary tooling regressions
        run: |
          uv run --no-sync python scripts/repository-boundary/audit-classification.py --check 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
          uv run --no-sync python scripts/repository-boundary/build-provenance.py --check 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
          uv run --no-sync python scripts/check-repository-dependencies.py 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
          uv run --no-sync python scripts/repository-boundary/check-python-imports.py 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
          git lfs fsck 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
      - name: Run nonempty release and boundary tooling suites
        run: |
          uv run --no-sync python - <<'PYTHON' 2>&1 | tee -a "$RUNNER_TEMP/portable-tooling.log"
          import sys
          import unittest

          for directory in ("scripts/package-sets", "scripts/public-release", "scripts/repository-boundary", "scripts/ci"):
              suite = unittest.TestLoader().discover(directory, pattern="test_*.py")
              count = suite.countTestCases()
              print(f"{directory}: collected {count} tests", flush=True)
              if count == 0:
                  raise SystemExit(f"Required tooling suite collected no tests: {directory}")
              if not unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite).wasSuccessful():
                  raise SystemExit(1)
          PYTHON
      - name: Install the isolated browser test runtime
        # Package tests and isolated consumers both launch Chromium. Install it
        # before the first browser-dependent check on a fresh runner.
        run: pnpm exec playwright install chromium
        working-directory: src/frontend
      - name: Check all frontend source with one shared package build
        working-directory: src/frontend
        run: |
          pnpm ci:source --receipt "$RUNNER_TEMP/frontend-source.json" 2>&1 | tee "$RUNNER_TEMP/frontend-source.log"
      - name: Run the same accountless browser smoke in both serving modes
        run: |
          uv run --no-sync python src/frontend/scripts/e2e/run-accountless-smoke.py \
            --evidence "$RUNNER_TEMP/accountless-smoke"
      - name: Build unpublished distribution artifacts
        run: |
          uv run --no-sync python scripts/package-sets/build.py build \
            --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/public-artifacts"
      - name: Verify consumers without a source checkout
        run: |
          uv run --no-sync python scripts/package-sets/build.py validate \
            "$RUNNER_TEMP/public-artifacts" \
            --work-dir "$RUNNER_TEMP/public-consumer"
      - name: Check Compose structure
        run: |
          bash -n reset.sh
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.development.yml config --quiet
          docker compose -f docker-compose.yml --profile '*' config --format json | uv run --no-sync python scripts/validate_local_compose.py
          docker compose -f docker-compose.yml -f docker-compose.development.yml --profile '*' config --format json | uv run --no-sync python scripts/validate_local_compose.py
      - name: Reclaim completed test environments before the baseline rebuild
        # The next build creates another isolated dependency tree. Retain package
        # bytes and test evidence, but release dependencies from completed tests.
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/src/frontend/node_modules" \
            "$RUNNER_TEMP/public-consumer/frontend/node_modules" \
            "$RUNNER_TEMP/public-consumer/backend/.venv"
          df -h "$RUNNER_TEMP"
      - name: Resolve exact compatibility baseline
        id: compatibility
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              base = event['pull_request']['base']['sha']
          elif os.environ['GITHUB_EVENT_NAME'] == 'push':
              base = event['before']
          else:
              result = subprocess.run(['git', 'rev-parse', 'HEAD^'], capture_output=True, text=True)
              base = result.stdout.strip() if result.returncode == 0 else '0' * 40
          if not re.fullmatch('[0-9a-f]{40}', base):
              raise SystemExit('Invalid compatibility baseline')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + ('' if base == '0' * 40 else base) + '\n')
          PYTHON
      - name: Check out exact baseline for provider compatibility
        if: steps.compatibility.outputs.commit != ''
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.compatibility.outputs.commit }}
          path: .compatibility-base
          lfs: true
          persist-credentials: false
      - name: Check provider compatibility against exact baseline
        if: steps.compatibility.outputs.commit != ''
        env:
          BASE_COMMIT: ${{ steps.compatibility.outputs.commit }}
        run: |
          if [ -f .compatibility-base/contracts/versions.json ]; then
            uv run --no-sync python scripts/package-sets/build.py build \
              --source "$GITHUB_WORKSPACE/.compatibility-base" --commit "$BASE_COMMIT" \
              --output "$RUNNER_TEMP/base-artifacts"
            uv run --no-sync python scripts/package-sets/build.py compare \
              "$RUNNER_TEMP/base-artifacts" "$RUNNER_TEMP/public-artifacts"
          else
            echo "Baseline predates the initial versioned package-set contract policy."
          fi
      - name: Read package-set identity
        id: package-set
        env:
          SET_DIRECTORY: ${{ runner.temp }}/public-artifacts
        run: |
          python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          digest = hashlib.sha256((Path(os.environ['SET_DIRECTORY']) / 'manifest.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('name=animama-set-' + os.environ['GITHUB_SHA'] + '-' + digest + '\n')
          PYTHON
      - name: Retain temporary validated PR or commit outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package-set.outputs.name }}
          path: ${{ runner.temp }}/public-artifacts/
          if-no-files-found: error
          retention-days: ${{ needs.validation-plan.outputs.retention }}
      - name: Retain focused test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-tooling.log
            ${{ runner.temp }}/frontend-source.log
            ${{ runner.temp }}/accountless-smoke/
            ${{ runner.temp }}/public-consumer/summary.json
            ${{ runner.temp }}/public-consumer/logs/
            ${{ runner.temp }}/public-consumer/frontend/*.png
          retention-days: ${{ job.status != 'success' && 14 || needs.validation-plan.outputs.retention }}
      - name: Record portable results and download cache state
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB: portable-product
        run: python3 scripts/ci/job_receipt.py --output "$RUNNER_TEMP/portable-receipt.json"
      - name: Retain compact portable receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-receipt.json
            ${{ runner.temp }}/frontend-source.json
          retention-days: 14

  validation:
    needs: [validation-plan, backend-static-tests, portable-product]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Require every selected job to succeed
        env:
          CI_PLAN: ${{ needs.validation-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/validation.py gate --output "$RUNNER_TEMP/validation.json"
      - name: Retain aggregate acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.json
          retention-days: 14
