name: Signed macOS desktop

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a helper for inventory review, or build a release from reviewed inputs
        type: choice
        options: [release, prepare-worker]
        default: release
      publish:
        description: Request a public testing preview, then stable promotion after separate native acceptance
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-macos-${{ inputs.operation }}
  cancel-in-progress: false

env:
  ANIMAMA_MACOS_NOTARY_PROFILE: animama-ci

jobs:
  release-policy:
    # No checkout or secrets: reject an accidental branch/fork dispatch before
    # reaching any credential-bearing job. Environment approval is still required.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected maintainer and main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "raymond-van/animama" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Desktop releases must run from raymond-van/animama on main."
            exit 1
          fi
          if [[ "$GITHUB_ACTOR" != "raymond-van" || "$GITHUB_TRIGGERING_ACTOR" != "raymond-van" ]]; then
            echo "::error::The selected release maintainer, raymond-van, must dispatch or rerun this workflow."
            exit 1
          fi

  source-validation:
    # Local reuse loads this workflow at the caller's exact commit. No release
    # secrets are inherited; both ordinary validation jobs must pass first.
    needs: release-policy
    permissions:
      contents: read
    uses: ./.github/workflows/validate-public.yml

  prepare-worker:
    if: inputs.operation == 'prepare-worker'
    needs: source-validation
    runs-on: macos-15 # Native arm64; macOS runners cannot host Docker testcontainers.
    environment: desktop-macos-signing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.28"
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - name: Import CI-only signing credentials
        run: node src/frontend/desktop/scripts/runtime/ci-keychain.mjs setup
        env:
          ANIMAMA_MACOS_CERTIFICATE_BASE64: ${{ secrets.ANIMAMA_MACOS_CERTIFICATE_BASE64 }}
          ANIMAMA_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ANIMAMA_MACOS_CERTIFICATE_PASSWORD }}
          ANIMAMA_APPLE_ID: ${{ secrets.ANIMAMA_APPLE_ID }}
          ANIMAMA_APPLE_APP_PASSWORD: ${{ secrets.ANIMAMA_APPLE_APP_PASSWORD }}
      - run: pnpm desktop:runtime:document-worker -- --platform darwin --arch arm64
        working-directory: src/frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reviewed-worker-candidate
          path: src/frontend/desktop/release/worker-input/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        run: node src/frontend/desktop/scripts/runtime/ci-keychain.mjs cleanup

  build:
    if: inputs.operation == 'release'
    needs: source-validation
    runs-on: macos-15
    environment: desktop-macos-signing
    timeout-minutes: 150
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.28"
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: git lfs fsck
      - run: pnpm check
      - run: pnpm web:lint
      - run: pnpm web:test
      - run: pnpm desktop:test
      - run: pnpm build
      - name: Acquire exact reviewed model inputs before pack production
        working-directory: .
        env:
          ANIMAMA_MODEL_ROOT: ${{ runner.temp }}/animama-models
        run: |
          python3 scripts/models/parakeet.py acquire
          python3 scripts/models/parakeet.py verify
          echo "ANIMAMA_MODEL_ROOT=$ANIMAMA_MODEL_ROOT" >> "$GITHUB_ENV"
      - run: pnpm desktop:runtime:stage -- --platform darwin --arch arm64
      - run: pnpm desktop:runtime:audit -- --platform darwin --arch arm64
      - name: Import CI-only signing credentials
        run: node desktop/scripts/runtime/ci-keychain.mjs setup
        env:
          ANIMAMA_MACOS_CERTIFICATE_BASE64: ${{ secrets.ANIMAMA_MACOS_CERTIFICATE_BASE64 }}
          ANIMAMA_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ANIMAMA_MACOS_CERTIFICATE_PASSWORD }}
          ANIMAMA_APPLE_ID: ${{ secrets.ANIMAMA_APPLE_ID }}
          ANIMAMA_APPLE_APP_PASSWORD: ${{ secrets.ANIMAMA_APPLE_APP_PASSWORD }}
      - run: pnpm desktop:dist:mac
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-macos-candidate
          path: src/frontend/desktop/release/publish/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        run: node desktop/scripts/runtime/ci-keychain.mjs cleanup

  smoke:
    needs: build
    runs-on: macos-15
    environment: desktop-macos-smoke
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-macos-candidate
          path: src/frontend/desktop/release/publish
      - name: Verify installed native app
        env:
          ANIMAMA_SMOKE_OPENAI_KEY: ${{ secrets.ANIMAMA_SMOKE_OPENAI_KEY }}
          ANIMAMA_SMOKE_SETUP: name # One fresh profile checks blank rejection and named completion.
        run: node desktop/scripts/runtime/ci-smoke.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: smoke-name
          path: src/frontend/desktop/release/smoke-name/
          if-no-files-found: warn
          retention-days: 30

  preview:
    if: inputs.publish
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    environment: desktop-macos-preview # Explicit approval to expose test binaries/packs publicly.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-macos-candidate
          path: src/frontend/desktop/release/publish
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: smoke-name
          path: src/frontend/desktop/release/smoke-name
      - name: Publish reviewed testing preview (not a stable update)
        env:
          ANIMAMA_RELEASE_TOKEN: ${{ secrets.ANIMAMA_RELEASE_TOKEN }}
        run: node src/frontend/desktop/scripts/runtime/publish-macos.mjs --confirm-preview-publication

  publish:
    if: inputs.publish
    needs: [build, smoke, preview]
    runs-on: ubuntu-24.04
    environment: desktop-macos-publication # REQUIRED: explicit raymond-van approval; see the solo-maintainer policy in releases.md.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-macos-candidate
          path: src/frontend/desktop/release/publish
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: smoke-name
          path: src/frontend/desktop/release/smoke-name
      - name: Publish exact accepted artifacts
        env:
          ANIMAMA_RELEASE_TOKEN: ${{ secrets.ANIMAMA_RELEASE_TOKEN }}
          ANIMAMA_MACOS_ACCEPTANCE: ${{ secrets.ANIMAMA_MACOS_ACCEPTANCE }}
        run: node src/frontend/desktop/scripts/runtime/publish-macos.mjs --confirm-publication
