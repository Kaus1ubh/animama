name: Shared or local product bug
description: A bug reproducible without hosted service internals
body:
  - type: markdown
    attributes:
      value: "Use a private maintainer channel for vulnerabilities, credentials, customer data or hosted internals. Read SECURITY.md before reporting sensitive details."
  - type: input
    id: version
    attributes:
      label: Animama version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Local reproduction and expected behavior
    validations:
      required: true
