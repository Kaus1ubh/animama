name: "Maintainer: parent proposal or specification"
description: Define a substantial outcome before dividing it into implementation tasks.
body:
  - type: markdown
    attributes:
      value: |
        Follow SPECS.md for authoring and SDLC.md for the lifecycle.
        This may begin as a proposal. Leave unresolved details explicit; submitting the form does not approve implementation.
        Keep credentials, personal data, private context and raw approval transcripts out of the issue. Use the security policy (.github/SECURITY.md) for sensitive reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: What happens today, why should it change, and who benefits?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Goals, scope and non-goals
      description: Include the desired outcomes and deliberate exclusions. State unresolved scope explicitly.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Required behavior
      description: Observable outcomes and relevant failure, cancellation, recovery and persistence behavior. Use stable requirement IDs for phased work.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Relevant compatibility, security, data, accessibility, performance or cost bounds.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions and evidence that will establish success. Identify any criteria still to be agreed.
      placeholder: "- [ ] Observable condition and required evidence."
  - type: textarea
    id: decisions
    attributes:
      label: Open questions and decisions
      description: Blocking questions, dated choices and non-sensitive owner acceptance. Keep this current as the proposal becomes agreed work.
      value: "Status: Proposal\nOwner decision: Pending"
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: Identify the authoritative specification. When this parent contains it, write "This issue"; otherwise link the owning issue. A retained draft is a snapshot after publication.
      value: "This issue."
  - type: textarea
    id: execplan
    attributes:
      label: ExecPlan
      description: Link the tracked ExecPlan at its reviewed revision. For an existing private plan, state "Private plan retained by maintainers" without a private URL or path. If no ExecPlan is needed, write "Not required" and explain why.
  - type: textarea
    id: delivery
    attributes:
      label: Delivery links
      description: List the plan's phases with any phase issues (needed only for separately assigned, cross-repository or dependency-tracked phases), dependencies and the plan's PR in this repository. Establish native issue relationships where available; text alone does not create them. Keep private planning paths out of this issue.
