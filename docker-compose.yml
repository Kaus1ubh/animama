  # Local observability UIs.
  dozzle:
    profiles: [dev-tools]
    image: amir20/dozzle:latest
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}dozzle"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - animama-network

networks:
  animama-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
