services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}postgres"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a}
      POSTGRES_DB: ${POSTGRES_DB:-animama}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      # - ./db/data:/var/lib/postgresql/data
      - postgres-data:/var/lib/postgresql/data
    networks:
      - animama-network
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animama} -d ${POSTGRES_DB:-animama}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    profiles: [dev-tools]
    image: dpage/pgadmin4:latest
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}pgadmin"
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@animama.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-a}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./alembic/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - animama-network
    depends_on:
      postgres:
        condition: service_healthy

  animama-server:
    build:
      context: .
      additional_contexts:
        browser_models: ${ANIMAMA_BROWSER_MODEL_DIR:-./models/browser-speech}
      target: animama-server
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}animama-server"
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Libraries such as Torch call getpass.getuser(); provide a logical name
      # because the host UID intentionally may not exist in the image passwd file.
      USER: animama
      LOGNAME: animama
      ANIMAMA_CONTENT_ROOT: /var/lib/animama/content
      ANIMAMA_DATA_ROOT: /var/lib/animama/data
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ANIMAMA_ELEVENLABS_REALTIME_TTS_USE_BACKEND_INTERMEDIARY: ${ANIMAMA_ELEVENLABS_REALTIME_TTS_USE_BACKEND_INTERMEDIARY:-}
      ANIMAMA_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-animama}:${POSTGRES_PASSWORD:-a}@postgres:5432/${POSTGRES_DB:-animama}"
      # Shared database bootstrap uses the same private database as the API.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-animama}
      PGPASSWORD: ${POSTGRES_PASSWORD:-a}
      PGDATABASE: ${POSTGRES_DB:-animama}
      ANIMAMA_DATABASE_POOL_SIZE: ${ANIMAMA_DATABASE_POOL_SIZE:-10}
      ANIMAMA_DATABASE_MAX_OVERFLOW: ${ANIMAMA_DATABASE_MAX_OVERFLOW:-20}
      ANIMAMA_DATABASE_POOL_TIMEOUT_SECONDS: ${ANIMAMA_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      ANIMAMA_DATABASE_POOL_RECYCLE_SECONDS: ${ANIMAMA_DATABASE_POOL_RECYCLE_SECONDS:--1}
      ANIMAMA_DATABASE_POOL_PRE_PING: ${ANIMAMA_DATABASE_POOL_PRE_PING:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANIMAMA_DEFAULT_MODEL_PROVIDER_ID: ${ANIMAMA_DEFAULT_MODEL_PROVIDER_ID:-OpenAIResponsesHTTPAgent:gpt-5.6-luna}
      ANIMAMA_LLM_SKIP: ${ANIMAMA_LLM_SKIP:-}
      WATCHFILES_FORCE_POLLING: "true"
      ANIMAMA_LOG_TZ: America/New_York
      ANIMAMA_LOG_DIR: /var/log/animama
      ANIMAMA_MEMORY_MANAGER_AGENT_MODEL: ${ANIMAMA_MEMORY_MANAGER_AGENT_MODEL:-gpt-5.6-luna}
      # Auxiliary title calls have their own backend-owned settings.
      ANIMAMA_CHAT_TITLE_GENERATION_ENABLED: ${ANIMAMA_CHAT_TITLE_GENERATION_ENABLED:-true}
      ANIMAMA_CHAT_TITLE_GENERATION_MODEL: ${ANIMAMA_CHAT_TITLE_GENERATION_MODEL:-gpt-5-nano}
      ANIMAMA_CHAT_TITLE_GENERATION_PROVIDER: ${ANIMAMA_CHAT_TITLE_GENERATION_PROVIDER:-OpenAIHTTPAgent}
      ANIMAMA_CHAT_TITLE_GENERATION_REASONING_EFFORT: ${ANIMAMA_CHAT_TITLE_GENERATION_REASONING_EFFORT:-low}
      ANIMAMA_CHAT_COMPACTION_ENABLED: ${ANIMAMA_CHAT_COMPACTION_ENABLED:-true}
      # Companion safety (operator settings). The Companion Guardrails are not configurable.
      ANIMAMA_COMPANION_SAFETY_ENABLED: ${ANIMAMA_COMPANION_SAFETY_ENABLED:-true}
      ANIMAMA_AI_NOTICE_ENABLED: ${ANIMAMA_AI_NOTICE_ENABLED:-true}
      ANIMAMA_AI_NOTICE_REMINDER_HOURS: ${ANIMAMA_AI_NOTICE_REMINDER_HOURS:-3}
      ANIMAMA_CRISIS_DETECTION_ENABLED: ${ANIMAMA_CRISIS_DETECTION_ENABLED:-true}
      ANIMAMA_CRISIS_RESOURCES_PATH: ${ANIMAMA_CRISIS_RESOURCES_PATH:-}
      ANIMAMA_MODEL_CLIENT_LOG_PREVIEWS: ${ANIMAMA_MODEL_CLIENT_LOG_PREVIEWS:-true}
      ANIMAMA_MODEL_CLIENT_LOG_PREVIEW_CHARS: ${ANIMAMA_MODEL_CLIENT_LOG_PREVIEW_CHARS:-240}
      ANIMAMA_OPENAI_RESPONSES_COMPACTION_THRESHOLD_TOKENS: ${ANIMAMA_OPENAI_RESPONSES_COMPACTION_THRESHOLD_TOKENS:-10000}
      # Local logging remains available; no bundled collector is required.
      OTEL_SDK_DISABLED: "true"
      ANIMAMA_PUBLIC_ORIGIN: ${ANIMAMA_PUBLIC_ORIGIN:-http://localhost:8000}
      ANIMAMA_WEB_ROOT: /opt/animama/web
      ANIMAMA_DISABLE_WEBUI_TELEMETRY: ${ANIMAMA_DISABLE_WEBUI_TELEMETRY:-true}
      ANIMAMA_STT_MODE: ${ANIMAMA_STT_MODE:-parakeet}
      ANIMAMA_STT_URL: ${ANIMAMA_STT_URL:-http://parakeet:8000}
      ANIMAMA_STT_AUTH_TOKEN: ${ANIMAMA_STT_AUTH_TOKEN:-}
      ANIMAMA_VOICE_SAMPLE_RATE: ${ANIMAMA_VOICE_SAMPLE_RATE:-16000}
      ANIMAMA_VOICE_CHANNELS: ${ANIMAMA_VOICE_CHANNELS:-1}
      ANIMAMA_TTS_MODE: ${ANIMAMA_TTS_MODE:-kokoro}
      ANIMAMA_TTS_URL: ${ANIMAMA_TTS_URL:-http://kokoro:8880}
      ANIMAMA_TTS_AUTH_TOKEN: ${ANIMAMA_TTS_AUTH_TOKEN:-}
      ANIMAMA_TTS_FORMAT: ${ANIMAMA_TTS_FORMAT:-pcm}
      ANIMAMA_TTS_SAMPLE_RATE: ${ANIMAMA_TTS_SAMPLE_RATE:-24000}
      ANIMAMA_MOTION_URL: ${ANIMAMA_MOTION_URL:-http://gesture:8000}
      ANIMAMA_USER_FILE_MAX_UPLOAD_BYTES: ${ANIMAMA_USER_FILE_MAX_UPLOAD_BYTES:-26214400}
      ANIMAMA_USER_FILE_PROCESSING_ENABLED: ${ANIMAMA_USER_FILE_PROCESSING_ENABLED:-true}
      ANIMAMA_USER_FILE_PROCESSING_MAX_ATTEMPTS: ${ANIMAMA_USER_FILE_PROCESSING_MAX_ATTEMPTS:-3}
      ANIMAMA_PARAKEET_STT_ENABLED: ${ANIMAMA_PARAKEET_STT_ENABLED:-true}
      # LiveKit configuration
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
    volumes:
      - ./.animama-logs:/var/log/animama
      - type: bind
        source: ${ANIMAMA_PARAKEET_MODEL_DIR:?Run python3 scripts/models/parakeet.py acquire then ./reset.sh or source the generated stack record}
        target: /opt/animama/web/__client-parakeet-models
        read_only: true
        bind:
          create_host_path: false
      # Optional operator-provided WebGPU encoder. Without an acquired set this
      # is the checked-in notices directory, so the encoder request returns 404.
      - type: bind
        source: ${ANIMAMA_PARAKEET_WEBGPU_MODEL_DIR:-./models/parakeet-tdt-0.6b-v2-webgpu}
        target: /opt/animama/web/__client-parakeet-webgpu-models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # Readable app-shipped typed content; never write catalog machinery here.
        source: ${ANIMAMA_INCLUDED_CONTENT_HOST_PATH:-./content/included}
        target: /var/lib/animama/content/included
        read_only: true
      - type: bind
        # Readable creator/import/operator library; FastAPI validates all bytes.
        source: ${ANIMAMA_LOCAL_CONTENT_HOST_PATH:-./content/local}
        target: /var/lib/animama/content/local
      - type: bind
        source: ${ANIMAMA_DATA_HOST_PATH:-./data}
        target: /var/lib/animama/data
    networks:
      - animama-network
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${WEB_SERVER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': urllib.parse.urlsplit(os.environ['ANIMAMA_PUBLIC_ORIGIN']).netloc}); urllib.request.urlopen(request, timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
        # parakeet:
        #   condition: service_started
        # kokoro:
        #   condition: service_started

