receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog:
    include:
      - /var/log/animama/*.log
    start_at: beginning
    include_file_path: true
    operators:
      - type: json_parser
        id: parse_json
        parse_from: body
        parse_to: attributes
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.000Z07:00'
        severity:
          parse_from: attributes.level
      - type: move
        from: attributes.message
        to: body

processors:
  batch:
  resource/logs:
    attributes:
      - key: service.name
        value: animama-server
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    enable_open_metrics: true
  otlp_http/tempo:
    endpoint: "http://tempo:4318"
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs/file:
      receivers: [filelog]
      processors: [resource/logs, batch]
      exporters: [otlp_http/loki]
    logs/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
