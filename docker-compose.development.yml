# Selected by reset.sh only for ANIMAMA_WEB_BUILD_MODE=development.
# The base graph remains deployable without a Vite or Node runtime.
services:
  animama-server:
    build:
      target: animama-server-development
    ports: !reset []
    environment:
      ANIMAMA_WEB_ROOT: ""
      ANIMAMA_BACKEND_RELOAD: "1"
      # Vite serves the operator's verified host sets (reset.sh mounts them).
      ANIMAMA_PARAKEET_SOURCE: operator
    volumes:
      - .:/app

  # Prepare persistent frontend dependency volumes for the host-mapped user
  # that runs Vite. Docker creates named-volume roots as root by default.
  web-deps-init:
    image: node:22-bookworm
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}web-deps-init"
    user: "0:0"
    command: >
      sh -c "chown ${HOST_UID:-1000}:${HOST_GID:-1000}
      /app/node_modules /app/web/node_modules /pnpm/store"
    volumes:
      - frontend_web_root_node_modules:/app/node_modules
      - frontend_web_node_modules:/app/web/node_modules
      - frontend_web_pnpm_store:/pnpm/store
    networks:
      - animama-network

  web:
    image: node:22-bookworm
    container_name: "${ANIMAMA_CONTAINER_NAME_PREFIX:-}web"
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    # CPU cap so parallel local stacks share the host; 0 removes it.
    cpus: ${ANIMAMA_WEB_CPUS:-2}
    tmpfs:
      - /app/desktop/node_modules:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
      - /app/web/dist:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      # Package dependencies and compiled outputs are platform-local, like web.
      - /app/packages/runtime-contracts/node_modules:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
      - /app/packages/discover-client/node_modules:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
      - /app/packages/product-ui/node_modules:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
      - /app/packages/runtime-contracts/dist:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /app/packages/discover-client/dist:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /app/packages/product-ui/dist:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /tmp/animama-web-home:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /tmp/animama-web-cache:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /tmp/animama-web-state:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775
      - /tmp/corepack:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
      - /tmp/corepack-bin:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=0775,exec
    # Keep dependency installs and pnpm's package store on persistent volumes.
    # This avoids charging roughly two gigabytes of dependency files to the
    # container's memory while preserving host-independent Linux packages.
    command: >
      sh -c "export PATH=/tmp/corepack-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin &&
      corepack enable --install-directory /tmp/corepack-bin &&
      pnpm install --frozen-lockfile --filter animama-frontend-workspace --filter animama-web... --prod=false &&
      exec sh scripts/start-compose-web.sh"
    # Development only: Vite owns the application origin and preserves browser
    # metadata when forwarding the closed API surface to private FastAPI.
    environment:
      - CI=true
      - NODE_ENV=development
      - ANIMAMA_WEB_BUILD_MODE=development
      - ANIMAMA_PUBLIC_ORIGIN=${ANIMAMA_PUBLIC_ORIGIN:-http://localhost:8000}
      - ANIMAMA_API_PROXY_TARGET=http://animama-server:8000
      - CHOKIDAR_USEPOLLING=${ANIMAMA_FILE_WATCH_POLLING:-false}
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - COREPACK_HOME=/tmp/corepack
      - HOME=/tmp/animama-web-home
      - XDG_CACHE_HOME=/tmp/animama-web-cache
      - XDG_STATE_HOME=/tmp/animama-web-state
      - NPM_CONFIG_STORE_DIR=/pnpm/store
      - VITE_APP_ENV=development
      - VITE_APP_VERSION=local
      - VITE_WEB_BASE_URL=${ANIMAMA_PUBLIC_ORIGIN:-http://localhost:8000}
      - VITE_FRONTEND_SERVER_BASE_URL=${ANIMAMA_PUBLIC_ORIGIN:-http://localhost:8000}
      - VITE_ENABLE_DEBUG_PANEL=${VITE_ENABLE_DEBUG_PANEL:-false}
      - VITE_DISABLE_WEBUI_TRACES=true
      - VITE_DISABLE_WEBUI_TELEMETRY=true
      - VITE_CLIENT_PARAKEET_MODEL_DIR=/app/parakeet-tdt-0.6b-v2
      - VITE_CLIENT_PARAKEET_WEBGPU_MODEL_DIR=/app/parakeet-tdt-0.6b-v2-webgpu
      - ANIMAMA_BROWSER_MODEL_DIR=/opt/animama/browser-models
    networks:
      - animama-network
    expose:
      - "5173"
    ports:
      - "127.0.0.1:${WEB_SERVER_PORT:-8000}:5173"
    depends_on:
      web-deps-init:
        condition: service_completed_successfully
      animama-server:
        condition: service_started
    volumes:
      - ./src/frontend:/app
      - ./models:/models:ro
      - type: bind
        source: ${ANIMAMA_BROWSER_MODEL_DIR:-./models/browser-speech}
        target: /opt/animama/browser-models
        read_only: true
        bind:
          create_host_path: false
      # The package builder carries the existing project notice into tarballs.
      - ./LICENSE:/LICENSE:ro
      # The Safety page bundles the canonical crisis protocol from the repository.
      - ./docs/safety:/docs/safety:ro
      # Vite's compatibility middleware reads legacy public URLs from the one
      # canonical Included tree while frontend consumers migrate to file refs.
      - type: bind
        source: ${ANIMAMA_INCLUDED_CONTENT_HOST_PATH:-./content/included}
        target: /content/included
        read_only: true
      - type: volume
        source: frontend_web_root_node_modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: frontend_web_node_modules
        target: /app/web/node_modules
        volume:
          nocopy: true
      - frontend_web_pnpm_store:/pnpm/store
      # Optional Parakeet set. Without an acquired set this is the checked-in
      # notices directory; reset.sh then reports dictation as not installed.
      - type: bind
        source: ${ANIMAMA_PARAKEET_MODEL_DIR:-./models/parakeet-tdt-0.6b-v2}
        target: /app/parakeet-tdt-0.6b-v2
        read_only: true
        bind:
          create_host_path: false
      # Optional experimental WebGPU encoder. Without an acquired set this is
      # the checked-in notices directory, so the encoder request returns 404.
      - type: bind
        source: ${ANIMAMA_PARAKEET_WEBGPU_MODEL_DIR:-./models/parakeet-tdt-0.6b-v2-webgpu}
        target: /app/parakeet-tdt-0.6b-v2-webgpu
        read_only: true
        bind:
          create_host_path: false

volumes:
  frontend_web_root_node_modules:
  frontend_web_node_modules:
  frontend_web_pnpm_store:
